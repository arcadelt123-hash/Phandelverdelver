<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>판델버 데이터 복구</title>
<style>
body{font:15px/1.6 'Pretendard',sans-serif;max-width:720px;margin:24px auto;padding:0 16px;background:#f6f1e6;color:#2b2218}
h1{font-size:20px}.box{background:#fff;border:1px solid #d9c9a6;border-radius:10px;padding:12px 14px;margin:12px 0}
.ok{color:#2e6b2e;font-weight:700}.no{color:#a33;font-weight:700}button{font:inherit;padding:6px 14px;border-radius:8px;border:1px solid #b8893a;background:#fff8e6;cursor:pointer;margin:4px 4px 0 0}
button.main{background:#7a4a14;color:#fff;border-color:#7a4a14}small{opacity:.7}#log{white-space:pre-wrap;font-size:13px}
</style></head><body>
<h1>판델버 데이터 복구</h1>
<p>이 브라우저에 남아 있는 판델버 데이터(임시 저장본)를 보여 주고, 서버로 되돌려 놓는 페이지예요.<br>
<small>※ 이 기기에서 판델버 사이트를 <b>열기 전에</b> 이 페이지를 먼저 열어야 해요. 사이트를 열면 임시 저장본이 서버 데이터로 바뀌어요.</small></p>
<div id="found"></div>
<div class="box"><b>진행 기록</b><div id="log"></div></div>
<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbzamFZWIFpfAbXgZkt7oihFeaVZmyJD8CcNZHWVd1wCia_dueuJrWH5cuZBaf92Jb0O/exec';
  var KEYS = ['pandelver:adventure_cache_v1', 'adventure_cache_v1'];
  var TKK = ['pandelver:adv_dev_tk', 'adv_dev_tk'];
  var $ = function (id) { return document.getElementById(id); };
  function log(t) { $('log').textContent += t + '\n'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  var tk = TKK.map(get).filter(Boolean)[0] || '';
  var found = [];
  KEYS.forEach(function (k) {
    var raw = get(k); if (!raw) return;
    try { var d = JSON.parse(raw); var sh = ((d.boardTex || {}).shops) || []; found.push({ k: k, d: d, sh: sh }); } catch (e) {}
  });
  var html = '';
  if (!found.length) html = '<div class="box no">이 브라우저에는 판델버 임시 저장본이 없어요.</div>';
  found.forEach(function (f, i) {
    var t = f.d.lastUpdated ? new Date(f.d.lastUpdated).toLocaleString('ko-KR') : '알 수 없음';
    html += '<div class="box"><div>저장본 ' + (i + 1) + ' <small>(' + esc(f.k) + ')</small></div><div>서버 기준 시각: ' + esc(t) + '</div>' +
      '<div>퀘스트 ' + (f.d.quests || []).length + ' (빈 "새로운 퀘스트" ' + (f.d.quests || []).filter(function (q) { return q.title === '새로운 퀘스트'; }).length + '개) / 도감 ' + (f.d.globalNpcs || []).length + '</div>' +
      '<div>PC: ' + (((f.d.boardTex || {}).pcs) || []).map(function (p) { var dt = (p.sheet || {}).detail || {}; return esc((p.name || 'PC') + ' (아이템 ' + ((dt.items || []).length) + ')'); }).join(', ') + '</div>' +
      '<button class="main" onclick="__all(' + i + ')">이 저장본 전체로 서버 되돌리기</button> <button onclick="__dlAll(' + i + ')">전체 내려받기 (보관용)</button><br>' +
      (f.sh.length ? '<div class="ok">상점 ' + f.sh.length + '곳: ' + f.sh.map(function (s) { return esc((s.name || '이름 없음') + ' (' + (s.items || []).length + '개)'); }).join(', ') + '</div>' +
        '<button onclick="__dl(' + i + ')">상점 데이터 내려받기 (보관용)</button>' +
        '<button onclick="__go(' + i + ')">상점만 서버에 채우기</button>'
        : '<div class="no">상점이 들어 있지 않아요.</div>') + '</div>';
  });
  $('found').innerHTML = html;
  window.__dl = function (i) {
    var f = found[i], o = {}; Object.keys(f.d.boardTex || {}).forEach(function (k) { if (/^shop/i.test(k)) o[k] = f.d.boardTex[k]; });
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(o)], { type: 'application/json' })); a.download = 'pandelver_shops_' + Date.now() + '.json'; a.click();
  };
  window.__dlAll = function (i) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(found[i].d)], { type: 'application/json' })); a.download = 'pandelver_full_' + Date.now() + '.json'; a.click();
  };
  // 저장본 전체(퀘스트·도감·PC·상점·타임라인)로 서버 데이터를 되돌려요. 되돌리기 전에 지금 서버 데이터를 파일로 먼저 내려받아 둬요.
  window.__all = function (i) {
    var f = found[i];
    if (!tk) { log('이 브라우저는 판델버에 로그인한 적이 없어서 서버에 저장할 수 없어요. "전체 내려받기"로 파일을 받아 전달해 주세요.'); return; }
    if (!confirm('서버 데이터를 이 저장본 전체로 되돌릴까요?\n(지금 서버 데이터는 먼저 파일로 내려받아 둬요)')) return;
    log('서버 데이터 불러오는 중…');
    fetch(EXEC + '?action=load&tk=' + encodeURIComponent(tk)).then(function (r) { return r.json(); }).then(function (cur) {
      if (cur.status === 'AUTH') throw new Error('이 기기의 로그인이 만료됐어요. "전체 내려받기"로 파일을 받아 전달해 주세요.');
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(cur)], { type: 'application/json' })); a.download = 'pandelver_server_before_restore_' + Date.now() + '.json'; a.click();
      log('지금 서버 데이터를 파일로 받아 뒀어요. 되돌리는 중…');
      var d = f.d, body = { folders: d.folders || [], quests: d.quests || [], globalNpcs: d.globalNpcs || [], timeline: d.timeline || null, boardTex: d.boardTex || null, lastUpdated: cur.lastUpdated, tk: tk };
      return fetch(EXEC, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); }).then(function (r) {
        if (r.status === 'OK') log('되돌리기 완료! 이제 판델버 사이트를 열어 확인하세요.');
        else if (r.status === 'CONFLICT') log('그사이 다른 기기가 저장했어요. 이 페이지를 새로고침하고 다시 눌러 주세요.');
        else log('저장 실패: ' + JSON.stringify(r));
      });
    }).catch(function (e) { log('오류: ' + (e && e.message || e)); });
  };
  window.__go = function (i) {
    var f = found[i];
    if (!tk) { log('이 브라우저는 판델버에 로그인한 적이 없어서 서버에 저장할 수 없어요. "내려받기"로 파일을 받아 전달해 주세요.'); return; }
    if (!confirm('서버의 지금 데이터는 그대로 두고, 비어 있는 상점 정보만 이 저장본으로 채울까요?')) return;
    log('서버 데이터 불러오는 중…');
    fetch(EXEC + '?action=load&tk=' + encodeURIComponent(tk)).then(function (r) { return r.json(); }).then(function (cur) {
      if (cur.status === 'AUTH') throw new Error('이 기기의 로그인이 만료됐어요. 내려받기로 파일을 받아 전달해 주세요.');
      cur.boardTex = cur.boardTex || {}; var moved = [];
      Object.keys(f.d.boardTex || {}).forEach(function (k) {
        if (!/^shop/i.test(k)) return; var now = cur.boardTex[k];
        var empty = now == null || (Array.isArray(now) && !now.length) || (typeof now === 'object' && !Array.isArray(now) && !Object.keys(now).length);
        if (empty) { cur.boardTex[k] = f.d.boardTex[k]; moved.push(k); }
      });
      if (!moved.length) { log('서버에 이미 상점이 있어서 바꾸지 않았어요.'); return; }
      log('채울 항목: ' + moved.join(', ') + ' → 저장 중…');
      var body = { folders: cur.folders, quests: cur.quests, globalNpcs: cur.globalNpcs, timeline: cur.timeline, boardTex: cur.boardTex, lastUpdated: cur.lastUpdated, tk: tk };
      return fetch(EXEC, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); }).then(function (r) {
        if (r.status === 'OK') log('복구 완료! 이제 판델버 사이트를 열어 상점을 확인하세요.');
        else if (r.status === 'CONFLICT') log('그사이 다른 기기가 저장했어요. 이 페이지를 새로고침하고 다시 눌러 주세요.');
        else log('저장 실패: ' + JSON.stringify(r));
      });
    }).catch(function (e) { log('오류: ' + (e && e.message || e)); });
  };
})();
</script>
</body></html>
